<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleMatch - Smart Clothing Combinations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <header>
            <h1>StyleMatch</h1>
            <p>Find your perfect look instantly.</p>
        </header>

        <main class="matcher-card">


            <div class="content-wrapper">
                <div class="input-section">
                    <div class="input-group">
                        <label for="color-select">Color <span class="required">*</span></label>
                        <input type="text" id="color-select" placeholder="e.g. Navy Blue">
                    </div>

                    <div class="input-group">
                        <label for="type-select">Clothing Type <span class="required">*</span></label>
                        <input type="text" id="type-select" placeholder="e.g. Denim Jacket">
                    </div>

                    <div class="input-group">
                        <label for="pattern-input">Pattern (Optional)</label>
                        <input type="text" id="pattern-input" placeholder="e.g. Stripes, Polka Dots">
                    </div>

                    <div class="input-group">
                        <label for="pattern-color-input">Pattern Color (Optional)</label>
                        <input type="text" id="pattern-color-input" placeholder="e.g. White, Black">
                    </div>

                    <div class="input-group">
                        <label for="gender-select">Gender <span class="required">*</span></label>
                        <div class="select-wrapper">
                            <select id="gender-select">
                                <option value="" disabled selected>Select gender...</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Unisex">Unisex</option>
                                <option value="Unspecified">Don't want to specify</option>
                            </select>
                            <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                    </div>

                    <button id="submit-btn" class="submit-btn">
                        <span>Get Style Advice</span>
                        <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="7 10 12 15 17 10" />
                            <line x1="12" y1="15" x2="12" y2="3" />
                        </svg>
                    </button>
                </div>

                <div class="visual-section">
                    <div id="result-image-container" class="result-image-container">
                        <!-- Image will be injected here -->
                    </div>
                </div>

                <div class="result-section">
                    <div id="loading" class="loading hidden">
                        <div class="washing-machine">
                            <div class="controls">
                                <div class="dial"></div>
                                <div class="switch"></div>
                            </div>
                            <div class="drum">
                                <span class="clothes">🧦</span>
                                <span class="clothes">👕</span>
                            </div>
                        </div>
                        <div class="bubbles">
                            <span></span><span></span><span></span><span></span><span></span>
                        </div>
                        <p class="loading-text">Spinning up some style advice...</p>
                    </div>

                    <div id="result-area" class="result-area hidden">
                        <div class="result-content">
                            <div class="result-text-container">
                                <span class="result-icon">✨</span>
                                <p id="result-text"></p>
                            </div>
                        </div>
                    </div>

                    <div id="placeholder" class="placeholder">
                        <div class="placeholder-content">
                            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"
                                stroke-linejoin="round" class="placeholder-icon">
                                <path
                                    d="M20.38 3.46L16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z">
                                </path>
                            </svg>
                            <p>Select your outfit to get pairing advice</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
